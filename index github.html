<style>
:root{
  --bg:#0c0d10;
  --bg-rail:#121317;
  --card:#17191e;
  --card-2:#1c1e24;
  --card-hi:#22252c;
  --edge:rgba(255,255,255,.06);
  --edge-hi:rgba(255,255,255,.12);
  --ink:#f2f4f8;
  --ink-dim:#9aa1ad;
  --ink-faint:#646a76;
  --red:#e4002b;            /* acento AMD */
  --red-soft:#ff3355;
  --green:#46d27e;
  --green-deep:#16361f;
  --amber:#f5b942;
  --blue:#4aa3ff;
  --ok:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
  min-height:100vh;
}
/* leve textura/profundidade no fundo, como o Adrenalin */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 88% -8%, rgba(228,0,43,.10), transparent 60%),
    radial-gradient(700px 600px at 6% 110%, rgba(70,210,126,.05), transparent 55%),
    linear-gradient(180deg,#0c0d10 0%, #0e0f13 60%, #090a0d 100%);
}

/* ===== barra de topo ===== */
.topbar{
  position:relative;z-index:3;display:flex;align-items:center;gap:22px;
  padding:14px 22px;background:rgba(14,15,19,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge);
}
.logo{
  width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--red),#b3001f);
  box-shadow:0 4px 18px rgba(228,0,43,.4);overflow:hidden;
}
.logo img{width:34px;height:34px;object-fit:contain;display:block}
.brand-name{font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:2px;
  color:var(--ink);margin-left:-13px}
.nav{display:flex;align-items:center;gap:4px}
.nav a{
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;font-weight:600;font-size:16px;letter-spacing:.4px;
  color:var(--ink-dim);text-decoration:none;padding:9px 16px;border-radius:9px;
  position:relative;transition:color .2s,background .2s;cursor:pointer;
}
.nav a:hover{color:var(--ink);background:var(--card)}
.nav a.active{color:var(--ink)}
.nav a.active::after{
  content:"";position:absolute;left:16px;right:16px;bottom:2px;height:2.5px;border-radius:3px;
  background:var(--red);box-shadow:0 0 10px rgba(228,0,43,.6);
}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--edge);
  border-radius:9px;padding:8px 13px;color:var(--ink-faint);font-size:13px;min-width:150px;
}
.live{
